# ─────────────────────────────────────────────────────────────────────────────
# Nginx config for Boostr Netwave Solutions
# 
# Save to:   /etc/nginx/sites-available/boostrnetwave.com
# Enable:    sudo ln -s /etc/nginx/sites-available/boostrnetwave.com \
#                      /etc/nginx/sites-enabled/
# Test:      sudo nginx -t
# Reload:    sudo systemctl reload nginx
# SSL:       sudo certbot --nginx -d boostrnetwave.com -d www.boostrnetwave.com
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name boostrnetwave.com www.boostrnetwave.com;

    # Let certbot handle the ACME challenge for SSL verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boostrnetwave.com www.boostrnetwave.com;

    # SSL certificates — certbot fills these in automatically
    ssl_certificate /etc/letsencrypt/live/boostrnetwave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boostrnetwave.com/privkey.pem;

    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # HSTS — tells browsers to always use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Serve the React build (frontend static files)
    root /var/www/boostrnetwave/client/dist;
    index index.html;

    # ── API: reverse proxy all /api/* requests to the Node backend ────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increased timeouts for file uploads
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Upload size limit (matches multer's 10MB + form overhead)
        client_max_body_size 15M;
    }

    # ── Static file caching ───────────────────────────────────────────────────
    # Vite-built assets have content hashes in filenames — safe to cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images and fonts — cache for 30 days
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    # For valid prerendered routes: serve the prerendered file
    # For invalid routes: serve 404.html (which has noindex baked in)
    location / {
        try_files $uri $uri/ /404.html;
    }

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml+rss image/svg+xml;
}
