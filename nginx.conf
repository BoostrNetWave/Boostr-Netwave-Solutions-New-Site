# ─────────────────────────────────────────────────────────────────────────────
# Nginx configuration for Boostr Netwave Solutions
#
# PURPOSE:
#   This file configures Nginx to act as the web server for both the
#   React frontend (static files) and the Node.js backend (API proxy).
#
# HOW TO USE (on the production server):
#   1. Copy to Nginx sites:
#      sudo cp nginx.conf /etc/nginx/sites-available/boostrnetwave.com
#
#   2. Enable the site:
#      sudo ln -s /etc/nginx/sites-available/boostrnetwave.com \
#                 /etc/nginx/sites-enabled/
#
#   3. Remove the default Nginx page:
#      sudo rm -f /etc/nginx/sites-enabled/default
#
#   4. Test the config (do this before every reload):
#      sudo nginx -t
#
#   5. Reload Nginx:
#      sudo systemctl reload nginx
#
#   6. Get free SSL certificate from Let's Encrypt (do this once):
#      sudo certbot --nginx -d boostrnetwave.com -d www.boostrnetwave.com
#      (Certbot will auto-fill the ssl_certificate lines below)
#
# HOW TRAFFIC FLOWS:
#   Browser → Nginx (port 443)
#     /api/* requests → forwarded to Node.js on port 5000
#     /* requests     → served from client/dist/ static files
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
# Redirect all plain HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name boostrnetwave.com www.boostrnetwave.com;

    # Allow Let's Encrypt SSL verification challenges to pass through
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (main site) ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name boostrnetwave.com www.boostrnetwave.com;

    # SSL certificates — certbot fills these lines in automatically when you run:
    # sudo certbot --nginx -d boostrnetwave.com -d www.boostrnetwave.com
    ssl_certificate /etc/letsencrypt/live/boostrnetwave.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/boostrnetwave.com/privkey.pem;

    # Modern, secure SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # HSTS: tells browsers to always use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Point Nginx to the pre-built React app static files
    # The 'npm run build' command in client/ creates this dist/ folder
    root /var/www/boostrnetwave/client/dist;
    index index.html;

    # ── API Proxy ─────────────────────────────────────────────────────────────
    # All /api/* requests are forwarded to the Node.js backend on port 5000.
    # The Node backend is kept running by PM2 (see ecosystem.config.cjs).
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        # Pass real client IP to Node (needed for rate limiting accuracy)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increased timeouts for file uploads (default is 60s, uploads may take longer)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Max upload size — matches the 10MB limit set in the Node upload route
        client_max_body_size 15M;
    }

    # ── Static Asset Caching ──────────────────────────────────────────────────
    # Vite adds a content hash to all JS/CSS filenames (e.g. index-a3f9b2.js)
    # so these files are safe to cache forever — when code changes, the filename changes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images, fonts, icons — cache for 30 days
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── SPA Fallback ──────────────────────────────────────────────────────────
    # For a React Single Page App (SPA):
    #   - If the file exists in dist/ (e.g. /sitemap.xml, /robots.txt), serve it directly.
    #   - If no file matches, serve 404.html (which has noindex tag and a styled 404 page).
    # This correctly handles React Router client-side routes like /services/web-development.
    location / {
        try_files $uri $uri/ /404.html;
    }

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip Compression ──────────────────────────────────────────────────────
    # Reduces bandwidth usage by compressing text-based responses
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml+rss image/svg+xml;
}
